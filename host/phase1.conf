# HHH 在当前 Ubuntu 服务器上的根目录
root_dir=/home/service2/HHH

# libvirt/QEMU 基本配置
libvirt_uri=qemu:///session
domain_name=hhh-phase1
machine=virt-6.2

# 两个对称 vNUMA 节点：总 vCPU 数为 2 * vcpus_per_node
vcpus_per_node=28
memory_mib_per_node=57344

# 每个 guest NUMA 节点对应的 host NUMA 节点和连续 CPU 起点
host_node0=0
host_node1=1
host_node0_first_cpu=0
host_node1_first_cpu=32

# QEMU 主线程与磁盘 I/O 线程专用 CPU
emulator_cpus=28,60
iothread_cpus=29,61

# hostfwd 与启动/关机等待时间
ssh_port=2222
ssh_timeout_seconds=180
shutdown_timeout_seconds=90
